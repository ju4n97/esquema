version: '3'

env:
  CGO_ENABLED: 0

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  build:
    desc: Fast local build for current OS/Arch
    cmd: >
      go build -trimpath -tags "netgo,osusergo"
      -ldflags "-s -w
      -X {{.MODULE}}/internal/version.version=dev
      -X {{.MODULE}}/internal/version.fullCommit=$(git rev-parse HEAD 2>/dev/null || echo none)
      -X {{.MODULE}}/internal/version.date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      -o bin/hclapi ./cmd/hclapi
    vars:
      MODULE:
        sh: go list -m

  build-all:
    desc: Compile matrix binaries for all platforms via GoReleaser
    cmd: goreleaser build --snapshot --clean

  release-dry-run:
    desc: Run full release lifecycle locally without publishing (includes archives, checksums, & docker)
    cmd: goreleaser release --snapshot --clean --skip=publish

  tag:
    desc: Validate and push an annotated release tag (e.g. task tag -- v0.1.0)
    cmd: ./scripts/tag.sh {{.CLI_ARGS}}

  clean:
    desc: Clean up build artifacts
    cmds:
      - rm -rf dist/
      - rm -rf bin/

  test:
    desc: Run unit tests
    cmd: go test ./...

  test-race:
    desc: Run tests with data race detector    
    cmd: CGO_ENABLED=1 go test -race -count=1 -timeout=30s ./...

  test-integration:
    desc: Run integration tests against real services
    cmd: CGO_ENABLED=1 go test -v -race -tags=integration ./test/integration/...

  lint:
    desc: Run linters
    cmd: golangci-lint run

  fmt:
    desc: Format all code and documentation
    cmds:
      - task: fmt-go
      - task: fmt-docs

  fmt-go:
    desc: Format Go source files
    cmd: golangci-lint fmt

  fmt-docs:
    desc: Format documentation Markdown files
    cmd: bunx prettier@latest --write docs/content

  gen:
    desc: Run all generators
    cmds:
      - task: gen-docs
      - task: gen-man

  gen-docs:
    desc: Generate CLI markdown documentation
    cmds:
      - go run -tags docs ./cmd/hclapi
      - bunx prettier@latest --write docs/content/cli

  gen-man:
    desc: Generate CLI man pages
    cmd: go run -tags man ./cmd/hclapi

  docs-dev:
    desc: Start local documentation server
    dir: docs
    cmd: bun run dev

  docs-build:
    desc: Build production documentation site
    dir: docs
    cmd: bun run build

  update:
    desc: Update Go dependencies to latest versions and tidy
    cmds:
      - go get -u ./...
      - go mod tidy